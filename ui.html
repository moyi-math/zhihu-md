<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知乎回答导出</title>
<style>
  :root {
    --bg: #f2f4f8;
    --card: #ffffff;
    --ink: #14181f;
    --ink-2: #3d4552;
    --muted: #6b7484;
    --line: #e4e8ef;
    --line-2: #eef1f6;
    --brand: #0568d8;
    --brand-2: #22a0ff;
    --brand-soft: #e8f2fe;
    --ok: #0f9d58;
    --ok-soft: #e7f6ec;
    --warn: #c2740a;
    --warn-soft: #fff4e2;
    --err: #d92d20;
    --err-soft: #fdecea;
    --term-bg: #0f141b;
    --term-ink: #ccd6e4;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.04);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 26px rgba(16,24,40,.07);
    --ring: 0 0 0 3px rgba(5,104,216,.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 14px; line-height: 1.6;
    display: flex; flex-direction: column; min-height: 100vh;
    -webkit-font-smoothing: antialiased; overflow-y: auto;
  }
  ::selection { background: rgba(5,104,216,.18); }

  /* ---------- header ---------- */
  header { padding: 20px 26px 14px; display: flex; align-items: center; gap: 13px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto; position: relative;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    box-shadow: 0 5px 14px rgba(5,104,216,.28);
    display: grid; place-items: center;
  }
  .logo::after {
    content: ''; position: absolute; inset: 0; border-radius: 11px;
    background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%);
  }
  .logo span { color: #fff; font-size: 20px; font-weight: 700; line-height: 1; position: relative; z-index: 1; }
  .title { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  h1 { font-size: 16.5px; margin: 0; font-weight: 650; letter-spacing: .1px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .ver { color: #9aa3b2; font-size: 11.5px; margin-left: 2px; }
  .badge {
    margin-left: auto; font-size: 12px; padding: 5px 12px; border-radius: 999px;
    background: #eef1f6; color: var(--muted); font-weight: 600; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; transition: all .2s;
  }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
  .badge.running { background: var(--warn-soft); color: var(--warn); }
  .badge.running::before { animation: pulse 1.1s ease-in-out infinite; }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .badge.error { background: var(--err-soft); color: var(--err); }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }

  /* ---------- layout ---------- */
  main { padding: 0 26px 20px; display: flex; flex-direction: column; gap: 13px; flex: 1 0 auto; min-height: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); padding: 16px 18px;
  }

  /* ---------- input ---------- */
  .label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; display: block; letter-spacing: .2px; }
  .inputrow { display: flex; gap: 10px; }
  .field { position: relative; flex: 1; min-width: 0; }
  .field svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #a7b0be; pointer-events: none; }
  input[type=text] {
    width: 100%; height: 44px; padding: 0 13px 0 38px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 10px; background: #fbfcfe; color: var(--ink);
    outline: none; transition: border-color .16s, box-shadow .16s, background .16s;
    font-family: inherit;
  }
  input[type=text]::placeholder { color: #a8b1c0; }
  input[type=text]:hover:not(:disabled) { border-color: #d3dae5; }
  input[type=text]:focus { border-color: var(--brand); box-shadow: var(--ring); background: #fff; }
  input[type=text]:disabled { opacity: .65; }

  button {
    height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background .15s, border-color .15s, transform .06s, box-shadow .15s;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
  }
  button:hover:not(:disabled) { background: #f7f9fc; border-color: #d3dae5; box-shadow: var(--shadow-sm); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: var(--ring); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #0a70e4, var(--brand));
    border-color: #045cbf; color: #fff; min-width: 128px; justify-content: center;
    box-shadow: 0 4px 12px rgba(5,104,216,.26), inset 0 1px 0 rgba(255,255,255,.16);
  }
  button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #0b78f0, #045dc4); border-color: #0354ad; }
  button.small { height: 36px; padding: 0 14px; font-size: 13px; border-radius: 9px; }

  .opts { display: flex; align-items: center; gap: 18px; margin-top: 13px; flex-wrap: wrap; }
  .opt { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); user-select: none; }
  .opt > span { color: var(--muted); }
  select, input[type=number] {
    height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px;
    background: #fbfcfe; font-size: 13px; color: var(--ink); outline: none; font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  select:hover, input[type=number]:hover { border-color: #d3dae5; }
  select:focus, input[type=number]:focus { border-color: var(--brand); box-shadow: var(--ring); }
  input[type=number] { width: 96px; }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; }

  /* ---------- 保存目录 ---------- */
  .saveas {
    display: flex; align-items: center; gap: 8px;
    margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--line);
  }
  .saveas .lb { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .saveas input {
    flex: 1; min-width: 0; height: 34px; padding: 0 10px; font-size: 12.5px;
    font-family: "Cascadia Mono", Consolas, monospace;
    border: 1px solid var(--line); border-radius: 8px; background: #fbfcfe; color: var(--ink-2);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .saveas input:hover:not(:disabled) { border-color: #d3dae5; }
  .saveas input:focus { border-color: var(--brand); box-shadow: var(--ring); background: #fff; }
  .saveas input:disabled { opacity: .6; }
  .saveas button { height: 34px; }
  .saveas .hint-ok { font-size: 12px; color: var(--ok); white-space: nowrap; }
  .saveas .hint-bad { font-size: 12px; color: var(--err); white-space: nowrap; }

  /* ---------- steps ---------- */
  .steps { display: flex; align-items: center; gap: 0; padding: 2px 2px 0; overflow: hidden; }
  .step { display: flex; align-items: center; flex: 0 0 auto; gap: 0; }
  .step .dot {
    width: 21px; height: 21px; border-radius: 50%; flex: 0 0 21px;
    background: #eaeef4; color: #64707f; border: 1px solid #d7dde6;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700; transition: all .25s;
  }
  .step .txt { font-size: 12.5px; color: #7b8494; margin: 0 8px 0 6px; white-space: nowrap; transition: color .25s; flex: 0 0 auto; }
  .step .line { width: 20px; height: 2px; background: #dfe4ec; border-radius: 2px; transition: background .25s; flex: 0 0 20px; }
  .step.active .dot { background: var(--brand-soft); color: var(--brand); border-color: #b6d4f7; box-shadow: 0 0 0 3px rgba(5,104,216,.12); }
  .step.active .txt { color: var(--brand); font-weight: 600; }
  .step.done .dot { background: var(--brand); color: #fff; border-color: var(--brand); }
  .step.done .txt { color: var(--ink-2); }
  .step.done .line { background: var(--brand); }
  .step.skipped { display: none; }

  /* ---------- terminal ---------- */
  .term-wrap { position: relative; flex: 0 0 auto; display: flex; }
  .term {
    background: var(--term-bg); border-radius: var(--radius); border: 1px solid #0a0e14;
    padding: 13px 15px; color: var(--term-ink); flex: 1;
    height: 240px; max-height: 42vh;
    overflow-y: auto; font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    font-size: 12.4px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    box-shadow: var(--shadow);
  }
  .term::-webkit-scrollbar { width: 10px; }
  .term::-webkit-scrollbar-track { background: transparent; }
  .term::-webkit-scrollbar-thumb { background: #2b3542; border-radius: 6px; border: 2px solid var(--term-bg); }
  .term::-webkit-scrollbar-thumb:hover { background: #3a4655; }
  .term .t-ok { color: #5ee08a; }
  .term .t-err { color: #ff8080; }
  .term .t-dim { color: #6d7887; }
  .term .t-info { color: #6cb2ff; }
  .term .t-warn { color: #f0b429; }
  .placeholder { color: #5c6a7a; }

  /* ---------- result ---------- */
  .result { display: none; border-left: 3px solid var(--ok); }
  .result.show { display: block; animation: rise .28s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .rhead { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14.5px; margin-bottom: 12px; }
  .rhead .check {
    width: 20px; height: 20px; border-radius: 50%; background: var(--ok); color: #fff;
    display: grid; place-items: center; flex: 0 0 auto; font-size: 11px;
  }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 13px; }
  .stat { background: #f8fafc; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; }
  .stat b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .stat span { font-size: 11.5px; color: var(--muted); }
  .rtitle { font-size: 13px; color: var(--ink-2); margin-bottom: 9px; word-break: break-word; }
  .path {
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.2px;
    background: #f6f8fb; border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px; word-break: break-all; color: #2b3440; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .path svg { flex: 0 0 auto; color: #9aa3b2; }
  .actions { display: flex; gap: 9px; flex-wrap: wrap; }
  .note {
    margin-top: 11px; padding: 9px 12px; border-radius: 9px; font-size: 12.5px;
    background: var(--warn-soft); color: #8a5a00; border: 1px solid #f3dcae; display: none;
  }
  .note.show { display: block; }

  /* ---------- error ---------- */
  .err-card { display: none; border-left: 3px solid var(--err); background: #fffbfb; }
  .err-card.show { display: block; animation: rise .28s ease-out; }
  .err-head { display: flex; align-items: center; gap: 9px; font-weight: 650; color: var(--err); margin-bottom: 8px; }
  .err-body { font-size: 13px; color: #7a2a24; white-space: pre-wrap; word-break: break-word; margin-bottom: 11px; }
  .field-err { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 9px;
    background: var(--err-soft); border: 1px solid #f6cfc9; color: #a3261b; font-size: 13px; }
  .field-err.show { display: block; }

  .spin { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.38); border-top-color: #fff;
    border-radius: 50%; animation: sp .75s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  body::-webkit-scrollbar { width: 11px; }
  body::-webkit-scrollbar-track { background: transparent; }
  body::-webkit-scrollbar-thumb { background: #ccd3de; border-radius: 6px; border: 3px solid var(--bg); }
  body::-webkit-scrollbar-thumb:hover { background: #b6bfcd; }

  footer {
    padding: 0 26px 16px; font-size: 12px; color: var(--muted);
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  }
  footer b { color: var(--ink-2); font-weight: 600; }
  footer .sep { color: #cfd6e0; }
</style>
</head>
<body>
<header>
  <div class="logo"><span>知</span></div>
  <div class="title">
    <h1>知乎回答导出</h1>
    <div class="sub">把问题的全部回答导出为 Markdown / PDF</div>
  </div>
  <div class="badge" id="badge">就绪</div>
</header>

<main>
  <section class="card">
    <label class="label" for="url">知乎问题链接</label>
    <div class="inputrow">
      <div class="field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <input id="url" type="text" spellcheck="false" autocomplete="off"
               placeholder="https://www.zhihu.com/question/2105779343171572976">
      </div>
      <button class="primary" id="run">开始抓取</button>
    </div>
    <div class="opts">
      <label class="opt"><span>排序</span>
        <select id="order">
          <option value="default">默认</option>
          <option value="updated">最近更新</option>
          <option value="created">按时间</option>
        </select>
      </label>
      <label class="opt"><span>最多抓取</span>
        <input id="limit" type="number" min="0" placeholder="全部">
      </label>
      <label class="opt"><input id="images" type="checkbox" checked> 下载图片到本地</label>
      <label class="opt"><input id="pdf" type="checkbox" checked> 同时生成 PDF</label>
    </div>
    <div class="saveas">
      <span class="lb">保存到</span>
      <input id="outDir" type="text" spellcheck="false" placeholder="D:\知乎导出">
      <button class="small" id="pickDir" title="打开系统文件夹选择框">浏览…</button>
      <span id="dirHint"></span>
    </div>
    <div class="field-err" id="fieldErr"></div>
  </section>

  <section class="steps" id="steps">
    <div class="step" data-stage="launch"><div class="dot">1</div><div class="txt">启动浏览器</div><div class="line"></div></div>
    <div class="step" data-stage="open"><div class="dot">2</div><div class="txt">打开页面</div><div class="line"></div></div>
    <div class="step" data-stage="load"><div class="dot">3</div><div class="txt">加载回答</div><div class="line"></div></div>
    <div class="step" data-stage="images"><div class="dot">4</div><div class="txt">下载图片</div><div class="line"></div></div>
    <div class="step" data-stage="pdf"><div class="dot">5</div><div class="txt">生成 PDF</div></div>
  </section>

  <div class="term-wrap">
    <section class="term" id="term"><span class="placeholder">等待开始……<br>首次使用会弹出浏览器窗口，扫码登录一次即可。</span></section>
  </div>

  <section class="card result" id="result">
    <div class="rhead"><span class="check">✓</span>导出完成</div>
    <div class="rtitle" id="rtitle"></div>
    <div class="stats">
      <div class="stat"><b id="sAnswers">0</b><span>条回答</span></div>
      <div class="stat"><b id="sImages">0</b><span>张图片</span></div>
      <div class="stat"><b id="sChars">0</b><span>字符</span></div>
      <div class="stat"><b id="sTime">0s</b><span>耗时</span></div>
    </div>
    <div class="path" id="rpath"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg><span id="rpathText"></span></div>
    <div class="actions">
      <button class="small" id="openMd">打开 Markdown</button>
      <button class="small" id="openPdf">打开 PDF</button>
      <button class="small" id="makePdf">生成 PDF</button>
      <button class="small" id="openFolder">打开文件夹</button>
      <button class="small" id="copyPath">复制路径</button>
    </div>
    <div class="note" id="rnote"></div>
  </section>

  <section class="card err-card" id="errCard">
    <div class="err-head"><span>✖</span>抓取失败</div>
    <div class="err-body" id="errBody"></div>
    <div class="actions">
      <button class="small" id="copyErr">复制错误详情</button>
      <button class="small" id="retry">重试</button>
    </div>
  </section>
</main>

<footer>
  <span>登录态：<b id="login">检查中…</b></span>
  <span class="sep">|</span>
  <span>版本 <b id="ver">—</b></span>
</footer>

<script>
const $ = (id) => document.getElementById(id);
// 服务端启动时生成的一次性 token：所有请求必须带上，否则 403
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const AUTH = TOKEN ? { 'x-zmd-token': TOKEN } : {};
const term = $('term');
const badge = $('badge');

let running = false;
let last = null;
let lastError = '';
let startedAt = 0;

/* ---------------- 状态 ---------------- */

function setBadge(text, cls) {
  badge.textContent = text;
  badge.className = 'badge' + (cls ? ' ' + cls : '');
}

function setRunning(v) {
  running = v;
  $('run').disabled = v;
  $('url').disabled = v;
  $('order').disabled = v;
  $('limit').disabled = v;
  $('images').disabled = v;
  $('pdf').disabled = v;
  $('outDir').disabled = v;
  $('pickDir').disabled = v;
  $('run').innerHTML = v ? '<span class="spin"></span>抓取中…' : '开始抓取';
}

function showFieldErr(msg) {
  const b = $('fieldErr');
  if (msg) { b.textContent = msg; b.classList.add('show'); }
  else { b.textContent = ''; b.classList.remove('show'); }
}

/* ---------------- 阶段进度 ---------------- */

const STAGE_RULES = [
  ['launch', /^浏览器:|已复用本地登录态|登录成功|预热/],
  ['open', /^→ 打开/],
  ['load', /^→ 滚动加载/],
  ['images', /^→ 下载图片/],
  ['pdf', /^→ 生成 PDF/],
];

function resetSteps() {
  document.querySelectorAll('.step').forEach((el) => el.classList.remove('done', 'active', 'skipped'));
  // 不生成 PDF 时隐藏最后一步
  document.querySelector('.step[data-stage="pdf"]').classList.toggle('skipped', !$('pdf').checked);
  document.querySelector('.step[data-stage="images"]').classList.toggle('skipped', !$('images').checked);
}
function markStep(key) {
  const order = ['launch', 'open', 'load', 'images', 'pdf'].filter(
    (k) => !document.querySelector(`.step[data-stage="${k}"]`).classList.contains('skipped')
  );
  const idx = order.indexOf(key);
  if (idx < 0) return;
  order.forEach((k, i) => {
    const el = document.querySelector(`.step[data-stage="${k}"]`);
    el.classList.remove('active', 'done');
    if (i < idx) el.classList.add('done');
    else if (i === idx) el.classList.add('active');
  });
}
function finishSteps() {
  document.querySelectorAll('.step').forEach((el) => {
    el.classList.remove('active');
    if (!el.classList.contains('skipped')) el.classList.add('done');
  });
}

/* ---------------- 日志 ---------------- */

function clearTerm() { term.innerHTML = ''; }

function appendLog(line) {
  const div = document.createElement('div');
  const t = String(line);
  if (/^✅|✅|✓ 登录成功|✓ 已复用/.test(t)) div.className = 't-ok';
  else if (/^✖|^  ! |失败|错误/.test(t)) div.className = 't-err';
  else if (/^→|^浏览器:|^(  标题|  共|  文件|  回答|  图片|  PDF|  接口)/.test(t)) div.className = 't-info';
  else if (/^\s*$/.test(t)) div.className = 't-dim';
  div.textContent = t;

  const stick = term.scrollTop + term.clientHeight >= term.scrollHeight - 24;
  term.appendChild(div);
  if (stick) term.scrollTop = term.scrollHeight;

  for (const [key, re] of STAGE_RULES) {
    if (re.test(t)) { markStep(key); break; }
  }
}

/* ---------------- 开始 ---------------- */

async function start() {
  const url = $('url').value.trim();
  if (!url) { showFieldErr('请先粘贴知乎问题链接'); $('url').focus(); return; }
  if (!/zhihu\.com|^\d{6,}$/.test(url)) {
    showFieldErr('看起来不是知乎问题链接，支持形如 https://www.zhihu.com/question/123456 或纯数字 id');
    $('url').focus();
    return;
  }
  showFieldErr('');
  $('result').classList.remove('show');
  $('errCard').classList.remove('show');
  last = null;
  lastError = '';

  setRunning(true);
  setBadge('抓取中', 'running');
  clearTerm();
  resetSteps();
  startedAt = Date.now();
  appendLog('开始处理：' + url);

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...AUTH },
      body: JSON.stringify({
        url,
        order: $('order').value,
        limit: Math.max(0, Math.floor(Number($('limit').value) || 0)),
        images: $('images').checked,
        pdf: $('pdf').checked,
      }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '启动失败');
  } catch (e) {
    setRunning(false);
    setBadge('出错', 'error');
    showError(String(e.message || e));
  }
}

$('run').addEventListener('click', start);
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !running) start(); });
$('url').addEventListener('input', () => showFieldErr(''));

/* ---------------- 结果 / 错误 ---------------- */

function fmtNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万';
  return String(n);
}

function showResult(r) {
  last = r;
  $('rtitle').textContent = r.title ? '问题：' + r.title : '';
  $('sAnswers').textContent = fmtNum(r.answers || 0);
  $('sImages').textContent = fmtNum(r.images || 0);
  $('sChars').textContent = fmtNum(r.chars || 0);
  const secs = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
  $('sTime').textContent = secs >= 60 ? Math.floor(secs / 60) + 'm' + (secs % 60) + 's' : secs + 's';
  $('rpathText').textContent = r.md;
  $('openPdf').style.display = r.pdf ? '' : 'none';
  $('makePdf').style.display = r.pdf ? 'none' : '';
  const note = $('rnote');
  if (r.note) { note.textContent = '⚠ ' + r.note; note.classList.add('show'); }
  else { note.classList.remove('show'); }
  $('result').classList.add('show');
  $('errCard').classList.remove('show');
}

function showError(msg) {
  lastError = msg;
  $('errBody').textContent = msg;
  $('errCard').classList.add('show');
  appendLog('✖ ' + msg);
}

/* ---------------- SSE ---------------- */

function connect() {
  const es = new EventSource('/api/events?t=' + encodeURIComponent(TOKEN));
  es.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'log') appendLog(m.line);
    else if (m.type === 'state') {
      setRunning(!!m.running);
      setBadge(m.running ? '抓取中' : '就绪', m.running ? 'running' : '');
      if (m.running) { startedAt = Date.now(); }
    } else if (m.type === 'done') {
      setRunning(false);
      setBadge('完成', 'done');
      finishSteps();
      showResult(m.result);
    } else if (m.type === 'error') {
      setRunning(false);
      setBadge('出错', 'error');
      showError(m.message);
    }
  };
  es.onerror = () => { setTimeout(connect, 1500); es.close(); };
}

/* ---------------- 保存目录 ---------------- */

function setDirHint(text, ok) {
  const h = $('dirHint');
  h.textContent = text || '';
  h.className = text ? (ok ? 'hint-ok' : 'hint-bad') : '';
  if (text) setTimeout(() => { if ($('dirHint').textContent === text) setDirHint(''); }, 2200);
}

async function applyOutDir(dir, { silent = false } = {}) {
  try {
    const r = await post('/api/setOutDir', { dir });
    if (!r.ok) {
      if (!silent) setDirHint(r.error || '设置失败', false);
      return false;
    }
    $('outDir').value = r.dir;
    if (!silent) setDirHint('已保存', true);
    return true;
  } catch (e) {
    if (!silent) setDirHint('设置失败：' + (e.message || e), false);
    return false;
  }
}

$('pickDir').onclick = async () => {
  const btn = $('pickDir');
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '选择中…';
  try {
    const r = await post('/api/pickDir', {});
    if (r.ok) {
      $('outDir').value = r.dir;
      setDirHint('已保存', true);
    } else if (r.canceled) {
      // 用户关掉了对话框，什么都不做
    } else {
      setDirHint(r.error || '选择失败', false);
    }
  } catch (e) {
    setDirHint('选择失败：' + (e.message || e), false);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
};

// 手动编辑：回车或失焦时保存；失败则回滚到原值
let savedDir = '';
$('outDir').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('outDir').blur(); }
});
$('outDir').addEventListener('focus', () => { savedDir = $('outDir').value; });
$('outDir').addEventListener('blur', async () => {
  const val = $('outDir').value.trim();
  if (!val || val === savedDir) return;
  const ok = await applyOutDir(val);
  if (!ok) $('outDir').value = savedDir;
  else savedDir = $('outDir').value;
});

/* ---------------- 操作 ---------------- */

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', ...AUTH },
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

$('openMd').onclick = () => last && post('/api/open', { type: 'md', path: last.md });
$('openPdf').onclick = () => last && last.pdf && post('/api/open', { type: 'pdf', path: last.pdf });
$('openFolder').onclick = () => last && post('/api/open', { type: 'folder', path: last.md });
$('retry').onclick = () => { $('errCard').classList.remove('show'); start(); };

$('copyPath').onclick = async () => {
  if (!last) return;
  const btn = $('copyPath');
  try {
    await navigator.clipboard.writeText(last.md);
    btn.textContent = '已复制';
    setTimeout(() => (btn.textContent = '复制路径'), 1200);
  } catch { }
};

$('copyErr').onclick = async () => {
  if (!lastError) return;
  try {
    await navigator.clipboard.writeText(lastError);
    $('copyErr').textContent = '已复制';
    setTimeout(() => ($('copyErr').textContent = '复制错误详情'), 1200);
  } catch { }
};

$('makePdf').onclick = async () => {
  if (!last) return;
  const btn = $('makePdf');
  btn.disabled = true;
  btn.textContent = '生成中…';
  try {
    const r = await post('/api/pdf', { path: last.md });
    if (r.ok) {
      last.pdf = r.pdf;
      $('openPdf').style.display = '';
      btn.style.display = 'none';
    } else {
      showFieldErr(r.error || 'PDF 生成失败');
    }
  } catch (e) {
    showFieldErr('PDF 生成失败：' + (e.message || e));
  } finally {
    btn.disabled = false;
    btn.textContent = '生成 PDF';
  }
};

/* ---------------- 初始化 ---------------- */

(async function init() {
  resetSteps();
  try {
    const r = await fetch('/api/config', { headers: AUTH }).then((x) => x.json());
    $('outDir').value = r.outDir || '';
    $('login').textContent = r.loggedIn ? '已登录' : '未登录（首次运行会提示扫码）';
    $('login').style.color = r.loggedIn ? 'var(--ok)' : 'var(--warn)';
    if (r.version) $('ver').textContent = 'v' + r.version;
  } catch { }
  connect();
  $('url').focus();
})();
</script>
